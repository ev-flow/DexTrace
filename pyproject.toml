[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dextrace.dalvik.data" = ["bytecode.txt"]

[project]
name = "dextrace"
version = "26.8.1"
description = "DEX/APK analyzer"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AnWei Kung", email = "sasakikung@gmail.com" },
  { name = "ShengFone Lu", email = "cindejze412@gmail.com" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["android", "dex", "apk", "dalvik", "xref", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/ev-flow/dextrace"
Repository = "https://github.com/ev-flow/dextrace"
Issues = "https://github.com/ev-flow/dextrace/issues"

[project.scripts]
dextrace = "dextrace.cli.main:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
